# package.ini - project metadata and command shortcuts, read by cli.ps1.
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[scripts]" + "Dev=..." is the same key as "scripts.Dev=..." read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.

[package]
Name=clipboard

# <major>.<minor>.<patch>. The development copy reports this value, the packaged copy inlines
# it, and the package folder is named after it.
Version=0.1.0

[scripts]
# cli <command> [args] runs the matching line and appends the remaining arguments.
# Relative paths resolve against this folder. The command is typed in any case.
Dev=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\tools\dev.ps1
Build=powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build.ps1
Client=powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-client.ps1
Assembly=powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-assembly.ps1
Test=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\tools\test.ps1
Bench=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\tools\bench.ps1
Shot=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\tools\shot.ps1
