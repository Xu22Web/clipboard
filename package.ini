# package.ini - project metadata and command shortcuts, read by run.ps1.
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[scripts]" + "Dev=..." is the same key as "scripts.Dev=..." read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.

[package]
Name=clipboard

# <major>.<minor>.<patch>. The development copy reports this value, the packaged copy inlines
# it, and the package folder is named after it.
Version=0.5.0

[scripts]
# run <command> [args] runs the matching line and appends the remaining arguments.
# Relative paths resolve against this folder. The command is typed in any case.
#
# Two shapes of line, the same two package.json uses. A line that starts with the name a package
# registers in its Bin= runs that tool, the way "build": "vite build" runs the vite package's
# command. A line that names a file runs it with the interpreter written on the line, the way
# "shot": "node tools/shot.js" runs a plain script.
Dev=builder-cli dev
Build=builder-cli build
Release=builder-cli release
Bundle=builder-cli bundle
Test=builder-test
Client=powershell -NoProfile -ExecutionPolicy Bypass -File packages\module\bin\module.ps1 packages\cli\client.ps1
Assembly=powershell -NoProfile -ExecutionPolicy Bypass -File packages\module\bin\module.ps1 packages\cli\assembly.ps1
Bench=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File packages\module\bin\module.ps1 packages\cli\bench.ps1
Shot=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File packages\module\bin\module.ps1 packages\cli\shot.ps1
Module=module
ModuleBench=powershell -NoProfile -ExecutionPolicy Bypass -File packages\module\bench.ps1
