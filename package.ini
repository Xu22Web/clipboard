# package.ini - project metadata and command shortcuts, read by cli.ps1.
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[scripts]" + "Dev=..." is the same key as "scripts.Dev=..." read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.

[package]
Name=clipboard

# <major>.<minor>.<patch>. The development copy reports this value, the packaged copy inlines
# it, and the package folder is named after it.
Version=0.5.0

[scripts]
# cli <command> [args] runs the matching line and appends the remaining arguments.
# Relative paths resolve against this folder. The command is typed in any case.
# Build, Bundle and Dev go through builder.cli.ps1, which assembles packages\bundler, packages\cli
# and packages\builder before it runs one of them; the rest are the cli package's own commands.
Dev=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\builder.cli.ps1 dev
Build=powershell -NoProfile -ExecutionPolicy Bypass -File .\builder.cli.ps1 build
Bundle=powershell -NoProfile -ExecutionPolicy Bypass -File .\builder.cli.ps1 bundle
Client=powershell -NoProfile -ExecutionPolicy Bypass -File .\packages\cli\client.ps1
Assembly=powershell -NoProfile -ExecutionPolicy Bypass -File .\packages\cli\assembly.ps1
Test=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\builder.cli.ps1 test
Bench=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\packages\cli\bench.ps1
Shot=powershell -NoProfile -ExecutionPolicy Bypass -Sta -File .\packages\cli\shot.ps1
