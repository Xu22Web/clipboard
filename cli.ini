# cli.ini - the repository tooling's settings, read by "cli dev" and "cli build".
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[build]" + "OutDir=dist" is the same key as "build.OutDir=dist" read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.
# The program version is not a tooling option: package.ini owns it.

[dev]

# how often the watcher looks at the source tree, in ms
Interval=600

# What a change restarts the resident on, comma separated. A glob is relative to src\: "*"
# and "?" match inside one file name, a leading "**/" walks the whole tree below that folder,
# and ".." steps out of src\ - the version lives in package.ini. A file that appears or
# disappears counts as a change as well. The user's clipboard.ini is deliberately absent:
# the resident writes to it (window size, window position) and watching it would restart
# the tool on its own writes.
Includes=**/*.ps1,*.cmd,lib/assembly/*.cs,lib/client/*.cs,themes/*.ini,../package.ini

# Globs to leave out of Includes, same syntax. A list written here removes files from the
# watch set; an empty value keeps the whole include set.
Excludes=

# 1 = compile src\lib\client\client.cs into src\client.exe before the first start, and
# again when client.cs changes; 0 = leave the file alone. clipboard.cmd falls back to the
# script when the file is missing.
Client=1

# 1 = compile src\lib\assembly\*.cs into src\lib\assembly\clipboard.dll before the first
# start, and again when a .cs changes; 0 = leave it alone (a run compiles the C# in-process
# when the dll is missing or older than the source, which costs about 1 s per start).
Assembly=1

[build]

# where the packaged folder is written; a relative path resolves against the repository root
OutDir=dist

# 1 = rewrite every .ps1 from its syntax tree (comments, indentation, blank lines gone)
Minify=1

# 1 = also rename internal functions and local variables; 0 = minify only
Rename=1

# 1 = run the CLI test suite against the packaged copy and drop it when it fails
Verify=1

# 1 = also ship README.md, LICENSE and docs\ (the screenshots, plus the page of every
# plugin and theme this build ships). 0 = the package carries the program only: the docs are
# the bulk of the archive (about 90 KB more) and are published separately.
IncludeDocs=0

# 1 = replace an existing clipboard-<version> folder
Overwrite=0

# 1 = additionally write clipboard-<version>.zip (the folder is always produced)
Zip=0

# 1 = compile src\lib\client\client.cs into client.exe inside the package; 0 = leave the file
# out. The client is an accelerator: clipboard.cmd falls back to the script when it is missing.
Client=1

# 1 = compile src\lib\assembly\*.cs into lib\assembly\clipboard.dll inside the package; 0 =
# leave it out. The assembly is an accelerator too: without it the package ships the .cs files
# and the types are compiled at run time. A machine without the .NET Framework compiler just
# gets the slower path.
Assembly=1

# Plugins to ship, comma separated. Names are file names without .ps1, and the value is
# written out rather than left empty so that a new file in plugins\ does not join the package
# by itself; empty would mean "every file", which is the run-time default, not a build list.
Plugins=entry-actions,item-marks,retention,transform

# Themes to ship, same rule: the value is the list, empty would mean "every file".
Themes=win11-dark,win11-light

# Extra files to ship, comma separated. A glob is relative to src\ (same syntax as [dev]).
# A .ps1 added here is minified and renamed with the rest; anything else is copied as it is.
# The default set already carries the program scripts, the selected plugins and themes, and
# (IncludeDocs=1) README.md, LICENSE and docs\; this key adds what that set does not cover.
Includes=

# Files to leave out of the package, comma separated, same syntax. Applied after Includes,
# so it also removes files a switch above brought in (e.g. one plugin of Plugins=).
Excludes=

[test]

# groups that run when no switch is given: unit, integration, e2e (comma separated)
Groups=unit,integration,e2e

# how many sandboxes may run side by side; 1 = serial
# measured on 12 logical cores, the `-Integration` parts (nine of them): 4 -> 165 s,
# 6 -> 140 s, 8 -> 133 s, 9 -> 130 s, 12 -> 129 s. Past the part count there is nothing
# left to start, so eight leaves one slot for the clipboard lane.
Workers=8
