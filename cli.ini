# cli.ini - the repository tooling's settings, read by "cli dev" and "cli build".
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[build]" + "OutDir=dist" is the same key as "build.OutDir=dist" read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.
# The program version is not a tooling option: package.ini owns it.

[dev]

# how often the watcher looks at the source tree, in ms
Interval=600

# The folder the two glob lists below are relative to. "." is the repository root, so a path
# here reads like the one on disk; an absolute path points the lists at another tree.
BaseUrl=.

# What a change restarts the resident on, comma separated. "*" and "?" match inside one file
# name, "**/" walks the whole tree below that folder. A file that appears or disappears counts
# as a change as well. The user's clipboard.ini is deliberately absent: the resident writes to
# it (window size, window position) and watching it would restart the tool on its own writes.
# A .cs file in the list is also what gets compiled: every source here is built into its
# product before the first start and again after a save, so leaving one out is how a product
# stays out of the loop.
Includes=src/**/*.ps1,src/*.cmd,src/*.sh,src/lib/assembly/*.cs,src/lib/client/*.cs,src/themes/*.ini,package.ini

# Globs to leave out of Includes, same syntax. A list written here removes files from the
# watch set; an empty value keeps the whole include set.
Excludes=

[build]

# where the packaged folder is written; a relative path resolves against the repository root
OutDir=dist

# The folder the include and exclude globs are relative to; "." is the repository root, the
# same value [dev] uses, so both lists read the same way.
BaseUrl=.

# 1 = rewrite every .ps1 from its syntax tree (comments, indentation, blank lines gone)
Minify=1

# 1 = also rename internal functions and local variables; 0 = minify only
Rename=1

# 1 = run the CLI test suite against the packaged copy and drop it when it fails
Verify=1

# 1 = replace an existing clipboard-<version> folder
Overwrite=0

# 1 = additionally write clipboard-<version>.zip (the folder is always produced)
Zip=0

# The package itself, comma separated, written relative to BaseUrl. The list is the folder: a
# file it reaches ships and nothing else does. What happens to each file is one table
# (tools\utils\pipeline.ps1): .ps1 minified and renamed, .cmd/.bat compressed, .sh compressed,
# .ini stripped of comments and blank lines, anything else copied. A .cs under src\lib\client
# is compiled into client.exe, one under src\lib\assembly into lib\assembly\clipboard.dll, and
# the product travels instead of the source; with no compiler around the sources travel and the
# program compiles them at run time. A path under src\ keeps its folders in the package; a path
# outside src\ keeps the folders it has here (docs\plugin\x.md), except the rows the same table
# flattens to the package root (scripts\*, whose batch files expect %~dp0 to be the program
# folder). Add "README.md,LICENSE,docs/**/*" to carry the docs too.
Includes=src/**/*.ps1,src/lib/client/*.cs,src/lib/assembly/*.cs,src/*.cmd,src/*.sh,src/themes/*.ini,scripts/**.bat

# Files to leave out of the package, comma separated, same syntax. Applied after Includes,
# so it also removes what one of the globs above brought in (e.g. src/plugins/item-marks.ps1).
Excludes=

[test]

# groups that run when no switch is given: unit, integration, e2e (comma separated)
Groups=unit,integration,e2e

# how many sandboxes may run side by side; 1 = serial
# measured on 12 logical cores, the `-Integration` parts (nine of them): 4 -> 165 s,
# 6 -> 140 s, 8 -> 133 s, 9 -> 130 s, 12 -> 129 s. Past the part count there is nothing
# left to start, so eight leaves one slot for the clipboard lane.
Workers=8
