# cli.ini - how a command runs here, as opposed to what a release is made of.
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";"
# starts a comment, and a "[section]" line puts the keys that follow into that section -
# "[build]" + "OutDir=dist" is the same key as "build.OutDir=dist" read from the top level.
# Section names are lower case, keys are PascalCase, and both are case-insensitive.
#
# Three files divide the tooling, the way an Electron project divides its own:
#
#   package.ini   the command table                    - the `cli` binary: which command runs what
#   cli.ini       this file: the whole build           - vite.config: entries, plugin chains, the
#                                                        copy list, and the develop / test switches
#   tools\        the engine                           - rollup and electron-builder: the bundler
#                                                        that reads this file, and the release script
#
# A key belongs in exactly one of them. An entry, a plugin chain or a list of files a package
# carries is this file's; a command line is package.ini's; what to do with one file once it is
# named is the engine's (tools\bundler\plugins). The program version is none of them:
# package.ini owns it.

[dev]

# how often the watcher looks at the source tree, in ms
Interval=600

# The folder the two glob lists below are relative to. "." is the repository root, so a path
# here reads like the one on disk; an absolute path points the lists at another tree.
BaseUrl=.

# What a change restarts the resident on, comma separated. "*" and "?" match inside one file
# name, "**/" walks the whole tree below that folder. A file that appears or disappears counts
# as a change as well. The user's clipboard.ini is deliberately absent: the resident writes to
# it (window size, window position) and watching it would restart the tool on its own writes.
# A .cs file in the list is also what gets compiled: every source here is built into its
# product before the first start and again after a save, so leaving one out is how a product
# stays out of the loop.
#
# This is the WATCH set, not the package: it says what makes a restart, and it is wider than
# what ships (the tooling itself is here so editing a build script restarts the run too).
Includes=src/**/*.ps1,src/*.cmd,src/*.sh,src/main/**/*.cs,src/preload/*.cs,src/themes/*.ini,src/lang/*.ini,src/ipc/*.ini,package.ini

# Globs to leave out of Includes, same syntax. A list written here removes files from the
# watch set; an empty value keeps the whole include set.
Excludes=

[build]

# where the packaged folder is written; a relative path resolves against the repository root
OutDir=dist

# 1 = rewrite every .ps1 from its syntax tree (comments, indentation, blank lines gone)
Minify=1

# 1 = also rename internal functions and local variables; 0 = minify only
Rename=1

# 1 = run the CLI test suite against the packaged copy and drop it when it fails
Verify=1

# 1 = replace an existing clipboard-<version> folder
Overwrite=1

# 1 = additionally write clipboard-<version>.zip (the folder is always produced)
Zip=0

# 1 = drop the definitions no load-time path reaches in a bundle. Left out or 0 keeps every
# definition: a bundle that keeps everything means the same thing as the dot-sourced program,
# and shaking is turned on per entry once its fingerprint has been stable for a while.
Treeshake=0

# How many entries `cli bundle -All` builds side by side. 0 = one per logical processor, capped
# at the number of entries; 1 = one after another. Each entry writes its own output and its own
# temp folder, so two workers never touch the same file.
Workers=0

[copy]

# What a release carries beside the outputs the entries produce. The folder the packaging script
# walks; the same value [dev] uses, so a watch path and a shipped path read alike.
BaseUrl=.

# The package itself, comma separated, written relative to BaseUrl. The list is the folder: a
# file it reaches ships and nothing else does. What happens to each file is one table
# (tools\bundler\assets.ps1): .ps1 minified and renamed, .cmd/.bat compressed, .sh compressed,
# .ini stripped of comments and blank lines, anything else copied. A .cs under a product folder
# is compiled into the file its entry declares, and the product travels instead of the source;
# with no compiler around the sources travel and the program compiles them at run time. A path
# under src\ keeps its folders in the package; a path outside src\ keeps the folders it has here
# (docs\en\plugin\x.md), except the rows the same table flattens to the package root (scripts\*,
# whose batch files expect %~dp0 to be the program folder). Add "README.md,LICENSE,docs/**/*" to
# carry the docs too.
#
# An entry and its plugin chain are in the [entry.*] and [product.*] sections at the bottom of
# this file; this list is what a package carries beside those outputs. The two meet when
# `cli build` asks the bundler for each entry.
#
# src/ipc/channels.ini is here on purpose: both halves of the command proxy read it, so a
# package without it still answers every command but loses the pipe (about 2 s per command).
Includes=src/**/*.ps1,src/preload/*.cs,src/main/**/*.cs,src/*.cmd,src/*.sh,src/themes/*.ini,src/lang/*.ini,src/ipc/*.ini,scripts/**.bat

# Files to leave out of the package, comma separated, same syntax. Applied after Includes,
# so it also removes what one of the globs above brought in (e.g. src/plugins/item-marks.ps1).
Excludes=

# ---------------------------------------------------------------- the build targets
# The part of a vite config that names the inputs and the plugins. One [product.<name>] is the
# chain that turns files into that kind of output; one [entry.<name>] is one output: what it is
# made of, where it lands. `cli bundle -Entry <name>` builds one, `-All` builds every one.

[product.renderer]

# The stages a renderer bundle uses. The chain is the order the plugins load in: resolve picks
# the files, treeshake marks what is unreachable, merge glues them through the syntax tree,
# render rewrites each module and then the whole text, verify reads the result back.
Chain=resolve,treeshake,merge,render,verify

[product.main]

# A C# product: the part stage resolves index.cs into a file list (scanning for a directive the
# way a compiler scans for a token, so "#part" inside a string declares nothing), the compile
# stage hands that list to csc. Nothing is ever concatenated into one .cs.
Chain=cs-part,cs-compile

[entry.app]

# The window layer as one file. A package carries this instead of its thirty modules, and the
# entry point loads it with one dot-source: `list` still reads thirty files, `ui` and `serve`
# read one.
#
# Minify=0 Rename=0 on purpose: the bundler resolves and merges, and the build's own passes do
# the compression and the renaming for the whole package. One table renames everything, so a
# name means the same thing in the bundle and in the files beside it.
#
# External= names the modules the bundle does not carry: the base layer keeps travelling as
# lib\*.ps1, so a #@use edge into one of them describes how two files meet at run time.
Product=renderer
To=renderer/app.ps1
Ship=1
Minify=0
Rename=0
External=lib/native,lib/text,utils/schema,utils/dpi,utils/image,lib/config,lib/store,lib/themes,lib/theme-stub,lib/plugin/plugins,renderer/src/windows/picker-geom
Modules=src/renderer/src/core/draw.ps1,src/lib/ipc.ps1,src/renderer/src/store/define.ps1,src/renderer/src/store/history-store.ps1,src/renderer/src/windows/media-render.ps1,src/renderer/src/windows/anim.ps1,src/renderer/src/windows/picker-draw.ps1,src/renderer/src/windows/picker-edit.ps1,src/renderer/src/windows/pinlist.ps1,src/renderer/src/windows/preview.ps1,src/renderer/src/windows/focus.ps1,src/renderer/src/windows/picker.ps1,src/renderer/src/windows/picker-live.ps1,src/renderer/src/core/layout.ps1,src/renderer/src/core/widgets.ps1,src/renderer/src/core/component.ps1,src/renderer/src/core/framework.ps1,src/renderer/src/core/views.ps1,src/renderer/src/core/setup.ps1,src/renderer/src/core/reactive.ps1,src/lib/settings-model.ps1,src/lib/settings-types.ps1,src/lib/settings-vm.ps1,src/lib/hotkey-record.ps1,src/renderer/src/windows/settings-draw.ps1,src/renderer/src/windows/settings-edit.ps1,src/renderer/src/windows/settings.ps1,src/renderer/src/windows/tray-menu.ps1
Keep=

[entry.core]

# The framework and the settings model as one file: the first entry that exists, and the one used
# to prove the merge. It is not shipped anywhere yet - it is a check, not a product.
#
# The list is the closure the modules declare themselves: every #@use names a module here, and
# the bundler refuses an entry whose list is short. Adding a module without a declaration is
# allowed (it is then simply not checked); leaving out a module another one #@uses is not.
Product=renderer
To=bundle-check/core.ps1
Modules=src/lib/native.ps1,src/lib/text.ps1,src/utils/schema.ps1,src/lib/config.ps1,src/lib/store.ps1,src/lib/themes.ps1,src/lib/theme-stub.ps1,src/lib/plugin/plugins.ps1,src/utils/dpi.ps1,src/renderer/src/core/draw.ps1,src/renderer/src/windows/anim.ps1,src/renderer/src/windows/picker-draw.ps1,src/renderer/src/core/layout.ps1,src/renderer/src/core/widgets.ps1,src/renderer/src/core/views.ps1,src/renderer/src/core/framework.ps1,src/renderer/src/core/component.ps1,src/renderer/src/core/reactive.ps1,src/renderer/src/core/setup.ps1,src/lib/settings-model.ps1,src/lib/settings-types.ps1,src/lib/settings-vm.ps1
Keep=

[entry.main]

# The type library. From= is the root whose #part lines decide the compile set; every source it
# reaches is compiled and nothing else, so a file nothing references never reaches the IL.
# A directive may not leave the folder the root file sits in.
#
# To= lands in the package as main\clipboard.dll: the folder named after the process that owns
# it, the way renderer\ holds the window layer and preload\ the accelerator.
Kind=cs
Product=main
From=src/main/index.cs
To=src/main/clipboard.dll
Target=library

[entry.client]

# The command-line accelerator. One source and no #part line: the part stage hands the compiler
# that file and nothing else. The program runs it when the file is there and falls back to the
# PowerShell path when it is missing, so a machine without a compiler loses a second per command.
Kind=cs
Product=main
From=src/preload/client.cs
To=src/preload/client.exe
Target=exe

[test]
# groups that run when no switch is given: unit, integration, e2e (comma separated)
Groups=unit,integration,e2e

# how many sandboxes may run side by side. Left out = one per logical processor, 1 = serial,
# any other number is what actually runs at once (the suite has fewer parts than a modern CPU
# has processors, so the part count is the real ceiling). Add "Workers=N" to pin it instead, or
# pass `cli test -Workers N` for one run.
