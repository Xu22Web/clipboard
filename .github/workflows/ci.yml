name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 工具是 Windows 专属（WinForms 面板、剪贴板 API、RegisterHotKey），Linux 上跑不了，
    # 所以 CI 直接用 windows-latest：那里的 powershell.exe 就是目标环境（5.1）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        shell: pwsh
        # 先把版本打出来：报错时能一眼看出是 5.1 还是 7（本项目只支持 5.1）。
        run: |
          $PSVersionTable.PSVersion
          (Get-Command powershell).Source

      - name: Self tests
        shell: pwsh
        # 结构组校验文件布局与纯 ASCII（PowerShell 5.1 按 GBK 读无 BOM 的 UTF-8 中文，
        # 所以脚本必须全 ASCII），单元组按名字调用内部函数，集成组起子进程跑每条 CLI 能力。
        run: .\xpm.ps1 test -Unit -Integration

      - name: Package and verify
        shell: pwsh
        # build.ini 默认 Verify=1：压缩改名之后拿产物再跑一遍 CLI 套件，行为变了就失败。
        run: .\xpm.ps1 build

  e2e:
    # 端到端要真实桌面：注册全局热键、接管剪贴板、启动常驻进程。托管 runner 不保证有
    # 交互式会话，这一项只作为参考信号，失败不拦合并（本机 xpm test -E2E 才是准的）。
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Resident and clipboard end-to-end
        shell: pwsh
        run: .\xpm.ps1 test -E2E
