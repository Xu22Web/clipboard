# win11-dark - Windows 11 Fluent, dark. This is the default theme and the reference layout.
#
# Format: flat keys before the first section, then [palette] / [fonts] / [metrics].
# Colours are #RRGGBB (opaque) or #AARRGGBB (alpha first). Overlay colours intentionally
# carry alpha so they composite over the surface, which is how Fluent layers hover and
# selection on top of the window background.
#
# A section named after a plugin restyles that plugin's ThemeSettings for this theme only,
# e.g. [item-marks] below. Plugins decide which of their keys are themeable.

name=win11-dark
description=Windows 11 Fluent, dark (default)
# empty = auto: Segoe UI Variable Text -> Segoe UI
font_family=
# empty = auto: Segoe Fluent Icons -> Segoe MDL2 Assets
icon_family=

[palette]
Surface=#202020
Field=#2D2D2D
FieldBorder=#18FFFFFF
Text=#FFFFFF
Dim=#AAAAAA
Faint=#8A8A8A
Accent=#60CDFF
AccentSoft=#1E60CDFF
Border=#16FFFFFF
SelBg=#1AFFFFFF
HoverBg=#12FFFFFF
BadgeBg=#10FFFFFF
BadgeText=#C8C8C8
KeyCapBg=#0CFFFFFF
KeyCapBorder=#1CFFFFFF
Mark=#FFC86E
Warn=#FF99A4

[fonts]
Body=10.5
Small=9
Tiny=9
Title=13
Icon=12
IconSmall=10
IconBig=24

# Plugin look for this theme (see README.md -> ThemeSettings)
[item-marks]
StarColor=#FFC86E
HighlightColor=#FFE3A3
HighlightBg=#26FFC86E
