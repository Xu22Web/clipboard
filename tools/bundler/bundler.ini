# tools\bundler\bundler.ini - what the bundler builds, and how.
#
# Read by tools\bundler\bundler.ps1 and checked against tools\schema\bundler.ps1 before anything
# runs, so a mistyped key stops the build instead of silently changing what it produces.
#
#   [bundler]          defaults for every entry
#   [product.<name>]   the plugin chain one kind of output goes through
#   [entry.<name>]     one output: which modules, in which order, written where
#
# The chain is the order the plugins are loaded in, and the stages are the ones a front-end
# bundler has: resolve, treeshake, renderModule, merge, renderChunk, verify. A stage is a plain
# hook a plugin under plugins\ supplies; a second product can reuse the same plugin files with
# different settings.

[bundler]

# where a bundle is written; a relative path resolves against the repository root
OutDir=dist

# 1 = replace an existing output, 0 = stop when it is there
Overwrite=1

# 1 = rewrite the bundle from its syntax tree (comments and indentation gone)
Minify=1

# 1 = rename internal functions and variables of a bundle, so two bundles do not share names
Rename=1

# 1 = drop the definitions no load-time path reaches. Off by default: a bundle that keeps
# everything means the same thing as the dot-sourced program, and this is turned on per entry
# once its fingerprint has been stable for a while.
Treeshake=0

# How many entries may be built side by side by `cli bundle -All`. 0 means one per logical
# processor, capped at the number of entries; 1 builds them one after another. Every entry
# writes its own output and its own temp folder, so two workers never touch the same file.
Workers=0

[product.renderer]

# The stages a renderer bundle uses. merge must come before render together with renderChunk:
# a module is rewritten on its own first, then the glued text gets its single pass.
Chain=resolve,treeshake,merge,render,verify

[product.main]

# A C# product: the part stage resolves index.cs into a file list (scanning for a directive the
# way a compiler scans for a token, so "#part" inside a string declares nothing), the compile
# stage hands that list to csc. Nothing is ever concatenated into one .cs.
Chain=cs-part,cs-compile

[entry.core]

# The framework and the settings model as one file: the first entry that exists, and the one
# used to prove the merge. It is not shipped anywhere yet - it is a check, not a product.
#
# The list is the closure the modules declare themselves: every #@use names a module here, and
# the bundler refuses an entry whose list is short. Adding a module without a declaration is
# allowed (it is then simply not checked); leaving out a module another one #@uses is not.
Product=renderer
To=bundle-check/core.ps1
Modules=src/lib/native.ps1,src/lib/text.ps1,src/utils/schema.ps1,src/lib/config.ps1,src/lib/store.ps1,src/lib/themes.ps1,src/lib/theme-stub.ps1,src/lib/plugin/plugins.ps1,src/utils/dpi.ps1,src/lib/panel/anim.ps1,src/lib/panel/picker-draw.ps1,src/lib/ui/layout.ps1,src/lib/ui/widgets.ps1,src/lib/ui/views.ps1,src/lib/ui/framework.ps1,src/lib/ui/component.ps1,src/lib/ui/reactive.ps1,src/lib/ui/setup.ps1,src/lib/settings-model.ps1,src/lib/settings-types.ps1,src/lib/settings-vm.ps1
Keep=

[entry.main]

# The type library. From= is the root whose #part lines decide the compile set; Append= carries
# what has not moved out of src\lib\assembly yet, so moving a block is: write the new file, add
# its #part line, delete the block. When that folder is empty the Append line goes away.
Kind=cs
Product=main
From=src/main/index.cs
Append=src/lib/assembly/*.cs
To=src/lib/assembly/clipboard.dll
Target=library
