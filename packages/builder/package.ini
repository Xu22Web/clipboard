# packages\builder\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose; see packages\bundler\
# package.ini for the rules every package file follows.
#
# This package is the shape electron-builder gives a release: it is given a folder of finished
# outputs plus the file list in builder.ini, and it writes the package folder. It never builds a
# target and never reads builder.cli.config.ps1 - what it packs arrives as a list of paths.
#
# The archive and the check run are release steps (builder-cli release), not packing steps:
# `run build` writes the folder and stops.

[package]
Name=builder
Version=1.0.0
Description=The release writer: staging, packing and the resolved configuration
License=MIT
Engines=5.1
Main=index.ps1
Exports=Invoke-Package,Invoke-BuilderArchive
Requires=
