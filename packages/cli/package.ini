# packages\cli\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose; see packages\bundler\
# package.ini for the rules every package file follows. Build settings are not here: they live in
# builder.cli.config.ps1 (Bundler and Watch), the way electron-vite keeps them in
# electron.vite.config.ts.
#
# This package is the shape electron-vite gives an Electron project: it reads
# builder.cli.config.ps1, builds every target through the bundler, and hands the result to the
# builder. It owns the command table builder-cli runs, the watcher, and the auxiliary scripts
# (client, assembly, bench, shot) that package.ini runs as plain files.
#
#   Requires  the packages this one loads. builder is loaded only by `builder-cli build`: a
#             plain `builder-cli bundle` or `builder-cli dev` never touches the release layer.
#             test is loaded only by `builder-cli release`, which checks the folder it wrote.

[package]
Name=cli
Version=1.0.0
Description=The command layer: targets, presets, the watcher and the tooling's defaults
License=MIT
Engines=5.1
Bin=builder-cli=bin/cli.ps1
Main=index.ps1
Exports=Invoke-CliCommand
Requires=bundler,builder,test


