# packages\cli\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose; see packages\bundler\
# package.ini for the rules every package file follows.
#
# This package is the shape electron-vite gives an Electron project: it reads the target file
# (cli.ini, the project's vite config), builds every target through the bundler, and hands the
# result to the builder. It owns the command table the cli binary runs, the watcher, and the
# auxiliary commands (test, shot, bench, client, assembly).
#
#   Depends   the packages this one loads. builder is loaded only by `cli build`: a plain
#             `cli bundle` or `cli dev` never touches the release layer.

[package]
Name=cli
Version=1.0.0
Main=index.ps1
Exports=Invoke-CliCommand
Requires=bundler,builder

[bundler]

# What every target does unless its own section overrides it. These are this package's
# defaults, the way vite keeps build.minify in the config rather than in rollup: cli.ini says
# what to build, this file says how, once.
#
# Minify rewrites a .ps1 from its syntax tree (comments, indentation, blank lines gone); Rename
# also shortens internal functions and local variables; Treeshake drops the definitions no
# load-time path reaches, and 0 keeps every definition - a bundle that keeps everything means
# the same thing as the dot-sourced program.
Minify=1
Rename=1
Treeshake=0

# How many targets `cli bundle -All` builds side by side. 0 = one per logical processor, capped
# at the number of targets; 1 = one after another. Each target writes its own output and its
# own temp folder, so two workers never touch the same file.
Workers=0

[watch]

# How often `cli dev` looks at the tree, in ms. What it watches comes from builder.ini Files
# plus the tooling itself, so a change to either config file or to packages\ restarts the run.
Interval=600
