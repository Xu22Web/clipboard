# packages\bundler\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose:
#
#   Name      the folder name; a caller names the package by it
#   Version   <major>.<minor>.<patch>
#   Description  one line: what the package is for, as package.json keeps it
#   License   the licence the package is published under (LICENSE states the same)
#   Engines   the PowerShell version it runs on
#   Main      the module file that is dot-sourced to load the package
#   Exports   what Main makes visible, one "Name=Alias" pair per entry, comma separated. A pair
#             with no alias exports the name itself. A name the file does not define is a
#             broken package and is reported when the package is loaded, not when it is called.
#   Requires  the packages this one loads, comma separated. Only a name listed here may be
#             loaded; a package that reaches into another one without saying so is a broken
#             package as well.
#
# Nothing else of the package is visible from outside: a caller loads Main and calls what
# Exports lists. That is why every package carries its own utils\ - two packages that shared an
# implementation file would be one package with two names.
#
# INI rules: one "Key=Value" per line, "#" or ";" starts a comment, "[package]" prefixes the
# keys that follow - "package.Name=..." is the same key from the top level.

[package]
Name=bundler
Version=1.0.0
Description=The bundler behind cli bundle and cli build: call graph, chunks and the verify pass
License=MIT
Engines=5.1
Main=index.ps1
Exports=Invoke-BundleTarget,Get-BundlerRoot
Requires=
