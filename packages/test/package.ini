# packages\test\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose; see packages\bundler\
# package.ini for the rules every package file follows.
#
# This package is the shape vitest gives a project: it reads test.config.ps1, starts the parts
# that config allows, and reports one row per check. The parts themselves live under tests\ - a
# test is a file of the project, not of the tool that runs it - and the driver, the harness and
# the reporter live here, so the run has no dependency on any other package.
#
# builder.ini [build] Verify=1 is this package being asked for by name: a release that fails its
# own suite is removed before it is reported as done.

[package]
Name=test
Version=1.0.0
Description=The test runner: the groups test.config.ps1 allows, one process per part
License=MIT
Engines=5.1
Bin=builder-test=bin/test.ps1
Main=index.ps1
Exports=Invoke-Test,Get-TestConfig
Requires=
