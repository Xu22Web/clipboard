# packages\module\package.ini - what this package is to the packages beside it.
#
# The fields are the ones package.json keeps for the same purpose; see packages\bundler\
# package.ini for the rules every package file follows.
#
# This package is the module layer: it reads the #@use / #@export comments a script already
# carries and turns them into something a loader can act on - the same job a JavaScript runtime
# does with import and export, minus what PowerShell cannot express (a module is dot-sourced
# into one scope, so there is no namespace and no live binding).
#
# Two callers, one rule set:
#   packages\cli       checks every target against it before the bundler writes anything
#   the running program  imports a graph instead of reading a hand-written module list
#
# The specifier forms, in the order they are tried:
#   ./name  ../name     a file beside the module that names it
#   <package>           that package's Main, from its own package.ini
#   <package>#Export    one name the package declares in Exports
#   <package>/sub/path  a file inside that package
#   name/of/module      a module id under src\, which is what #@use has always meant

[package]
Name=module
Version=1.0.0
Description=The module layer: ESM-style specifiers, the import graph and the export check
License=MIT
Engines=5.1
Main=index.ps1
Exports=Resolve-ModuleSpecifier,Get-ModuleGraph,Get-ModuleOrder,Get-ModuleLoadNote,Test-ModuleSpecifiers
Requires=
