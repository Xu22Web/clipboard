# build.ini - settings for build.ps1. Flat key=value, # starts a comment.
# Nothing is passed on the command line: run "powershell -File build.ps1"
# (add -Config <file> only to use a different settings file).

# version of the package; empty = git describe --tags --always --dirty,
# and the date when git is not available
Version=

# where the packaged folder is written; relative paths resolve against this folder
OutDir=dist

# 1 = rewrite every .ps1 from its syntax tree (comments, indentation, blank lines gone)
Minify=1

# 1 = also rename internal functions and local variables; 0 = minify only
Rename=1

# 1 = run the CLI test suite against the packaged copy and drop it when it fails
Verify=1

# 1 = also ship README.md, LICENSE and docs\ (screenshots)
IncludeDocs=1

# 1 = replace an existing clipboard-<version> folder
Overwrite=0

# 1 = additionally write clipboard-<version>.zip (the folder is always produced)
Zip=0

# plugins to ship, comma separated; empty = every file in plugins\
# names are file names without .ps1, e.g. Plugins=item-marks,transform
Plugins=

# themes to ship, comma separated; empty = every file in themes\
Themes=
