# build.ini - options for scripts\build.ps1, read by "cli build".
#
# INI rules: one "Key=Value" per line, "#" or ";" starts a comment, and a "[section]" line
# puts the keys that follow into that section - "[build]" + "OutDir=dist" is the same key as
# "build.OutDir=dist" read from the top level. Sections are lower case, keys PascalCase, and
# both are case-insensitive. The program version is not a build option: package.ini owns it.

[build]

# where the packaged folder is written; a relative path resolves against the repository root
OutDir=dist

# 1 = rewrite every .ps1 from its syntax tree (comments, indentation, blank lines gone)
Minify=1

# 1 = also rename internal functions and local variables; 0 = minify only
Rename=1

# 1 = run the CLI test suite against the packaged copy and drop it when it fails
Verify=1

# 1 = also ship README.md, LICENSE and docs\ (the screenshots, plus the page of every
# plugin and theme this build ships)
IncludeDocs=1

# 1 = replace an existing clipboard-<version> folder
Overwrite=0

# 1 = additionally write clipboard-<version>.zip (the folder is always produced)
Zip=0

# 1 = compile src\lib\cbx.cs into cbx.exe inside the package. It is an accelerator, not a
# requirement: clipboard.cmd runs the PowerShell client when the file is missing, and a
# machine without the .NET Framework compiler just gets the slower path.
Cbx=1

# plugins to ship, comma separated; empty = every file in plugins\
# names are file names without .ps1, e.g. Plugins=item-marks,transform
Plugins=

# themes to ship, comma separated; empty = every file in themes\
Themes=
