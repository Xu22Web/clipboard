# src\shared\ipc\channels.ini - the command surface the resident process answers.
#
# A command line costs about 2.5 s, almost all of it PowerShell starting and parsing this
# program. The resident already paid that, so a command it may answer is worth sending over
# the pipe. What may cross is decided here, once: src\main\utils\proxy.ps1 reads this file for both
# halves (the caller and the resident), and src\preload\client.cs reads it too, so the three
# agree by construction rather than by a comment saying "same list as".
#
# One section per built-in command. Two things are stated per channel, and they answer two
# different questions:
#
#   Remote=1     the resident process may answer it over the pipe (main\utils\proxy.ps1)
#   Handler=x    a caller inside this process may reach it by name: `Invoke-Ipc 'list'`
#                runs x (preload\utils\ipc.ps1). A channel without Handler= is not part of that surface.
#
# A command line runs a command either way; Handler= is what a window uses, because a window
# needs the value, not the printed form of it.
#
# One section per built-in command. Remote=1 means the resident answers it; Remote=0 means the
# command line runs it itself, because it changes settings, moves the store, touches the
# registry, opens a window, or is the resident.
#
# A plugin verb needs no section: it reads and writes entries exactly the way the built-in ones
# do, and the server accepts any name shaped like one (see Plugins below). A verb a plugin must
# keep to itself gets a section of its own with Remote=0.
#
# If this file is missing or unreadable, nothing crosses: every command takes the slow path and
# still gives the same answer. The package carries it (cli.ini [copy] Includes), so a build
# without it fails its own tests rather than quietly losing the fast path.

[channels]

# 1 = a name shaped like a verb (<lower case letters, digits, _ or -), with no section of its
# own, may be answered by the resident. That is what lets a plugin add a command without
# editing this file.
Plugins=1

# ---------------------------------------------------------------- answered by the resident

# version is answered from memory; the resident knows the same number this file does
[channel.version]
Remote=1

# status reads the data folder, the settings and the panel geometry - all loaded there
[channel.status]
Remote=1

# the history itself: reading it is the whole point of the fast path, and it is the one
# channel a window reads by name today (the panel refreshes through Invoke-Ipc 'list')
[channel.list]
Remote=1
Handler=Get-Records

# get copies one entry to the clipboard instead of printing it
[channel.get]
Remote=1

# put appends what the caller already read from stdin
[channel.put]
Remote=1

# del, clear and pick change the store; the resident owns the lock and the cache
[channel.del]
Remote=1
Handler=Remove-Record

[channel.clear]
Remote=1

[channel.pick]
Remote=1

# pause and resume only flip the resident's own capture switch
[channel.pause]
Remote=1

[channel.resume]
Remote=1

# ---------------------------------------------------------------- answered by the caller

# edit opens an editor window and waits for it: there is no answer to hand back over a pipe
[channel.edit]
Remote=0

# the transfer commands move the store or write files beside it
[channel.export]
Remote=0

[channel.import]
Remote=0

[channel.backup]
Remote=0

[channel.restore]
Remote=0

[channel.migrate]
Remote=0

# settings are files, and a picker or tray may be showing them
[channel.config]
Remote=0

[channel.themes]
Remote=0

[channel.settings]
Remote=0

# shortcuts, startup entries and the registry
[channel.install]
Remote=0

[channel.uninstall]
Remote=0

# the resident itself, and the window it owns
[channel.serve]
Remote=0

[channel.stop]
Remote=0

[channel.ui]
Remote=0

# help is printed by whatever process the user typed into
[channel.help]
Remote=0
