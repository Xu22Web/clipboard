about.Version = clipboard，Windows 的剪贴板历史
about.Data Format = history.dat 写入时的头部标识；clipboard migrate 可升级旧文件
about.Entries = history.dat 中的行数；受条目上限约束，标记可以保护行
about.Store Folder = history.dat、媒体文件与日志都在这里
about.Settings File = 这个窗口里的每个值都写入这里
about.Plugins = 按此顺序加载；Plugins= 决定加载哪些，空值表示全部
about.repository = {0}  -  源码、发布与问题反馈

; 设置行标题与说明：键名是身份，这里只放译文
key.DataDir = 数据目录
desc.DataDir = 历史与媒体文件的写入位置；相对路径相对于脚本目录
key.Hotkey = 全局热键
desc.Hotkey = 唤醒面板的全局热键
key.HotkeyFallbacks = 备用热键链
desc.HotkeyFallbacks = 逗号分隔，按顺序在 Hotkey 之后尝试，最多三个
key.PasteKeys = 粘贴按键
desc.PasteKeys = 选中后发送的 SendKeys
key.ModReleaseTimeout = 修饰键等待
desc.ModReleaseTimeout = 等待松开修饰键的毫秒数；超时后仍按住的会被释放
key.PasteSettle = 粘贴前等待
desc.PasteSettle = 发送粘贴按键前的等待毫秒数
key.MaxItems = 条目上限
desc.MaxItems = 历史上限，被标记保护的行不计数
key.MaxTextBytes = 单条文本上限
desc.MaxTextBytes = 单条文本的字节上限，更大的内容不保存
key.MaxTextTotalBytes = 文本总量上限
desc.MaxTextTotalBytes = 全部文本条目的总字节数
key.MaxMediaTotalBytes = 媒体总量上限
desc.MaxMediaTotalBytes = 图片与富文本文件的字节预算，0 = 不限
key.CaptureImages = 捕获图片
desc.CaptureImages = 开 = 捕获剪贴板中的图片
key.MaxImageBytes = 单张图片上限
desc.MaxImageBytes = 单张图片的字节上限，更大的不捕获
key.CaptureRich = 记录富文本
desc.CaptureRich = 开 = 记录富文本的 html / rtf
key.MaxHtmlBytes = HTML 上限
desc.MaxHtmlBytes = html 块的字节上限，超过时单独丢弃 html
key.MaxRtfBytes = RTF 上限
desc.MaxRtfBytes = rtf 块的字节上限，超过时丢弃 rtf，按纯文本粘贴
key.RtfImagesUpToBytes = RTF 内嵌图上限
desc.RtfImagesUpToBytes = 超过此大小的 rtf 排版时用占位符标出图片位置，粘贴仍保留图片，0 = 从不
key.InlineImageUpToBytes = 内联图片上限
desc.InlineImageUpToBytes = html 指向的临时图片不超过此大小时内联，0 = 从不
key.PasteRich = 保留格式粘贴
desc.PasteRich = 开 = 粘贴时保留格式，关 = 始终纯文本
key.PasteFilesAsText = 文件列表附带文本
desc.PasteFilesAsText = 开 = 文件列表同时以文本（路径）写入剪贴板
key.PasteTyping = 逐字输入
desc.PasteTyping = 开 = 把纯文本输入到焦点控件，而不是发送粘贴键
key.AppRules = 按程序规则
desc.AppRules = 按程序的粘贴方式：名称:plain|rich|no-paste，用 ; 分隔（* 表示其余程序）
key.BlobChars = 正文外置阈值
desc.BlobChars = 超过此字符数的正文存到 data\blobs，0 = 从不
key.Interval = 轮询间隔
desc.Interval = 剪贴板轮询间隔（ms）
key.NoPaste = 仅复制
desc.NoPaste = 开 = 只写入剪贴板，不注入粘贴
key.Balloon = 启动气泡
desc.Balloon = 开 = 启动时显示托盘气泡
key.Theme = 主题
desc.Theme = 主题名 = themes\ 中的文件名
key.Language = 语言
desc.Language = 界面文案与字体族的语言，对应 lang\ 中的文件名
key.ExcludePattern = 排除规则
desc.ExcludePattern = 匹配的文本不会被保存
key.WindowWidth = 面板宽度
desc.WindowWidth = 完整面板宽度（96 dpi 基准）
key.Rows = 可见行数
desc.Rows = 可见行数，高度随之计算（行数 × 40 + 110）
key.CompactMode = 紧凑面板
desc.CompactMode = 开 = 打开紧凑面板，关 = 完整面板
key.CompactWidth = 紧凑宽度
desc.CompactWidth = 紧凑面板宽度（96 dpi 基准）
key.CompactRows = 紧凑行数
desc.CompactRows = 紧凑面板的可见行数
key.WindowLeft = 面板左坐标
desc.WindowLeft = 完整面板左边位置，留空 = 在打开的屏幕上居中
key.WindowTop = 面板上坐标
desc.WindowTop = 完整面板顶部位置，留空 = 在打开的屏幕上居中
key.SaveWindowPos = 记住面板位置
desc.SaveWindowPos = 开 = 把移动后的完整面板位置写回本文件
key.ShowTime = 时间列
desc.ShowTime = 开 = 显示相对时间列
key.ShowTypeIcon = 类型图标
desc.ShowTypeIcon = 开 = 显示插件提供的行图标
key.ShowThumbnails = 缩略图
desc.ShowThumbnails = 开 = 在图片或富文本行的图标位置显示小图
key.Highlight = 高亮匹配
desc.Highlight = 开 = 高亮搜索命中
key.HighlightMaxBytes = 高亮上限
desc.HighlightMaxBytes = 超过此字节数跳过高亮（0 = 总是高亮）
key.ShowNewlineMarker = 换行标记
desc.ShowNewlineMarker = 开 = 用 <NL> 显示换行，关 = 折叠为空格
key.PreviewHover = 悬停预览
desc.PreviewHover = 开 = 显示悬停预览卡，关 = 不显示
key.PreviewDelay = 预览延迟
desc.PreviewDelay = 光标停留多久后显示预览卡（ms）
key.PreviewChars = 预览字数
desc.PreviewChars = 预览卡读取的字符数
key.Undo = 撤销删除
desc.Undo = 开 = Ctrl+Z 撤销上次删除
key.DpiAware = DPI 感知
desc.DpiAware = 开 = 按显示器 DPI 渲染
key.ScrollLines = 滚轮行数
desc.ScrollLines = 滚轮一格的行数（0 = 可见行数的四分之一）
key.Animations = 过渡动画
desc.Animations = 开 = 悬停、选中与滚动条带过渡，关 = 瞬时
key.Autostart = 登录自启
desc.Autostart = 开 = install 创建登录自启快捷方式
key.DesktopShortcut = 桌面快捷方式
desc.DesktopShortcut = 开 = install 创建桌面快捷方式
key.Plugins = 插件
desc.Plugins = 逗号分隔的插件文件名，顺序即加载顺序（空值 = plugins\ 下全部）

key.item-marks.MaxPins = 置顶上限
desc.item-marks.MaxPins = 置顶条目的数量上限，0 = 不限
key.item-marks.ClearKeepsPinned = 清空保留置顶
desc.item-marks.ClearKeepsPinned = 开 = 清空时保留置顶行，关 = 一并清除
key.item-marks.StickyPins = 置顶粘在顶部
desc.item-marks.StickyPins = 开 = 搜索时置顶行仍在顶部，关 = 搜索时一并隐藏
key.item-marks.StickyRows = 粘性置顶行数
desc.item-marks.StickyRows = 搜索时置顶行最多占用的行数，0 = 能放多少放多少
key.entry-actions.Detail = 类型详情
desc.entry-actions.Detail = kind：short = 一行摘要，full = 完整内容
key.entry-actions.PreviewChars = 类型预览字数
desc.entry-actions.PreviewChars = kind：预览中显示的字符数
key.entry-actions.Detect = 识别格式
desc.entry-actions.Detect = kind：要识别的格式，逗号分隔
key.entry-actions.ShowTargets = 拆解目标
desc.entry-actions.ShowTargets = kind：开 = 把链接、邮箱、路径与文件列表拆成各部分
key.entry-actions.Browser = 浏览器
desc.entry-actions.Browser = open：http(s) 链接使用的浏览器 exe，留空 = 系统默认
key.entry-actions.Reveal = 在资源管理器中定位
desc.entry-actions.Reveal = open：开 = 定位选中的文件，而不是运行它
key.transform.Mode = 改写方式
desc.transform.Mode = 粘贴时如何改写文本
key.transform.Modes = 菜单中的改写方式
desc.transform.Modes = 右键菜单中提供的模式，逗号分隔（默认全部）
key.transform.Trim = 去除首尾空格
desc.transform.Trim = 开 = 去掉结果首尾的空格
key.retention.MaxAgeDays = 保留天数
desc.retention.MaxAgeDays = 删除早于这么多天的条目，0 = 永久保留
key.retention.SweepMinutes = 清理间隔
desc.retention.SweepMinutes = 多久允许清理一次（分钟）
key.retention.KeepPinned = 保留置顶
desc.retention.KeepPinned = 开 = 带排序标记的行（置顶条目）永不过期

; 插件标记词：键 = mark.<插件 Name>.<标记字符>；缺键时用插件自己声明的英文词
[mark]
item-marks.p = 置顶
item-marks.s = 星标
item-marks.h = 高亮

