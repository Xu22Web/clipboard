about.Version = clipboard, the clipboard history for Windows
about.Data Format = the header history.dat is written with; clipboard migrate upgrades an older file
about.Entries = rows in history.dat; Max Items caps them, a mark can protect a row
about.Store Folder = history.dat, the media files and the log live here
about.Settings File = every value in this window is written here
about.Plugins = loaded in this order; Plugins= picks them, an empty value means all of them
about.repository = {0}  -  the source, the releases and the issue tracker

