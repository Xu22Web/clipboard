search = Search clipboard history
foot.copiedAdmin = Copied to the clipboard. That window runs as administrator - press Ctrl+V there
foot.copiedNoFocus = Copied to the clipboard. The window did not come back to the front - press Ctrl+V there
foot.deleted = Deleted. Press Ctrl+Z to undo
foot.undoOff = Undo is off. Set Undo=1 in clipboard.ini to enable it
foot.nothingToUndo = Nothing to undo
foot.restored = Restored to its original position
foot.nothingToClear = Nothing to clear
foot.cleared = History cleared
foot.clearedKept = History cleared, {0} kept
foot.nothingToCopy = Nothing to copy
foot.noEntry = No entry at that number
foot.nothingToPaste = Nothing to paste
