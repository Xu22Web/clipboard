; lang\en.ini - the words the tool draws, in English. This file is the base: every other
; language is laid over it, so a line a translation has not reached yet still reads as English.
;
; Keys are identities: a schema key (settings.key.*), a group, a unit, a plugin name. Nothing in
; this file is stored in clipboard.ini. {0} / {1} are filled by the caller in order, and a
; language that has no separate singular writes only .other.

[meta]
code = en
name = English
font =

[app]
tooltip = clipboard - {0}
balloonTitle = clipboard is running
balloonText = Hotkey: {0}  |  click the tray icon for history

[panel]
