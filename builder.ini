# builder.ini - what a release carries, read by packages\builder.
#
# INI rules shared by every .ini in this repository: one "Key=Value" per line, "#" or ";" starts a
# comment, and a "[section]" line puts the keys that follow into that section. Section names are
# lower case, keys are PascalCase, and both are case-insensitive.
#
# The three keys are electron-builder's, and only the ones this project needs: how the packed
# scripts are written, the output folder, and the file list. Nothing here decides what a target
# is - that is builder.cli.config.ps1 - and nothing here runs a check: `cli release` does that
# after the folder is written.
#
# electron-builder: compression - store | normal | maximum
#
# store packs every file as it is, normal rewrites each .ps1 from its syntax tree, maximum also
# shortens internal functions and local variables. One setting covers the whole package with one
# table, so a name means the same thing in the window bundle and in the files beside it.
Compression=maximum

[directories]

# electron-builder: directories.output - the folder a release is written to. The package folder
# inside it is named after package.ini Version.
Output=dist

# The folder the file list and the output folder are relative to; "." is the repository root, so
# a shipped path reads like the one on disk.
BaseUrl=.

[files]

# electron-builder: files - what the release carries beside the outputs. The pattern language is
# electron-builder's, i.e. minimatch: relative to BaseUrl, "*" and "?" stay inside one name, "**"
# as a path portion recurses ("src/**" is every file under src), "[abc]" is a character class and
# "{a,b}" a choice. A path prefixed with "!" removes what it reaches, and the list applies in
# order, so a later pattern can put a file back ("src/**/*.ps1,!src/plugins/*.ps1" ships every
# script but the plugins).
#
# Written the same way electron-builder writes it: one recursive pattern per kind of file, not a
# line per folder. A folder added under src\ is picked up without touching this file.
#
# What happens to one listed file is this package's table (packages\builder\assets.ps1): a .ps1
# is written as Compression says, a .cmd or .bat is compressed, a .sh is compressed, an .ini is
# stripped of comments and blank lines, anything else is copied. A .cs is compiled into the file
# its target declares and the compiled file travels instead of the source; without a compiler the
# sources travel and the program compiles them at run time.
#
# A path under src\ keeps its folders in the package; a path outside src\ keeps the folders it has
# here, except the rows the same table flattens to the package root (scripts\*, whose batch files
# expect %~dp0 to be the program folder). The licence and the two READMEs travel with the program,
# as they do in every package this tooling imitates; the docs\ pages are opt-in.
Files=src/**/*.ps1,src/**/*.cs,src/**/*.ini,src/**/*.cmd,src/**/*.sh,scripts/**/*.bat,LICENSE,README.md,README.zh-CN.md
